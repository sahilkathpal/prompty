name = "prompty-relay"
main = "src/index.ts"
compatibility_date = "2024-12-18"
compatibility_flags = ["nodejs_compat"]

# KV bindings. Replace `id` and `preview_id` with values from
#   wrangler kv namespace create GOOGLE_JWKS_CACHE
#   wrangler kv namespace create RATE_LIMITS
#   wrangler kv namespace create SESSIONS
# (See relay/README.md.)
[[kv_namespaces]]
binding = "GOOGLE_JWKS_CACHE"
id = "cd4fed5435a84fb79bd7ca31e5126026"
preview_id = "beb5361ecfc7495fa5fb13b6f7ee70c5"

[[kv_namespaces]]
binding = "RATE_LIMITS"
id = "44520b69a8ff493386aa118637f3e004"
preview_id = "1e584ddbe9414b90ae1221e3d80e7ff2"

[[kv_namespaces]]
binding = "SESSIONS"
id = "183f27acc9534850bb06fed866c613c6"
preview_id = "e31c10cf9e324710b5e07ab8dfbfcbe2"

# Non-secret config can live here; secrets go through `wrangler secret put`.
# We meter by mints (ephemeral keys issued), not minutes — a continuous call is
# 1 mint regardless of length. 50/day comfortably covers a heavy real day while
# bounding a single account. See RUBY_AUTH_RELAY_PLAN.md §Rethink #3.
[vars]
DAILY_MINT_LIMIT = "50"
# App config links served by GET /config. Edit + `wrangler deploy` to change a
# link live — the desktop app picks it up on next launch, no rebuild needed.
FOUNDERS_URL = "https://cal.com/team/revise-ai/quick-chat"
HOW_IT_WORKS_URL = "https://howrubyworks.codeongrass.com"
# STOPGAP (added 2026-07-01, remove once desktop app persists session JWT +
# wires refresh). /auth/google will accept Google ID tokens whose exp is up to
# 14 days past, provided signature/iss/aud/email_verified all still pass and
# iat is also within 14 days. Rollback: delete this line and `wrangler deploy`.
ALLOW_STALE_GOOGLE_IDTOKEN_DAYS = "14"
