appId: app.prompty.desktop
productName: Ruby
copyright: Copyright © 2026 Ruby
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  # Tray icon lives outside dist/; bundle it at the asar path tray.ts resolves
  # to (__dirname/../../../resources/tray-icon-Template.png) or the menu-bar
  # icon is invisible in packaged builds.
  - resources/tray-icon-Template*.png
  - package.json
  - "!**/*.map"
  - "!**/.DS_Store"
extraResources:
  # Block G2: embed the signed Swift sidecar produced by scripts/prebuild-sidecar.mjs.
  # Lands at <App>.app/Contents/Resources/audio-sidecar — matches resolveSidecarBinary().
  - from: resources/audio-sidecar
    to: audio-sidecar
mac:
  category: public.app-category.productivity
  target:
    # dmg = the hand-off download. zip = what Squirrel.Mac / electron-updater
    # actually applies on macOS — latest-mac.yml references the .zip, so OTA
    # auto-update does NOT work with a dmg-only build (OTA plan prereq #6).
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Signing identity: electron-builder selects the login-keychain cert whose name
  # matches the CSC_NAME env var (set in app/.env.local, loaded by `npm run dist`).
  # Do NOT reintroduce `identity: ${env.*}` — the pinned electron-builder does not
  # expand that macro, so it silently falls back to ad-hoc signing (which then
  # fails notarization). CSC_NAME is read directly and is honored only while
  # `mac.identity` is unset, so this key is intentionally absent.
  # We notarize ourselves in scripts/notarize.mjs (afterSign hook), so disable
  # electron-builder's built-in notarytool integration.
  notarize: false
  # Core Audio process tap (system-audio capture) requires macOS 14.4+.
  minimumSystemVersion: "14.4"
  extendInfo:
    NSMicrophoneUsageDescription: "Ruby needs microphone access to transcribe your side of the call."
dmg:
  writeUpdateInfo: true
  sign: false
afterSign: scripts/notarize.mjs
publish:
  # Block G4: auto-update feed. Host `latest-mac.yml`, the .zip, and the
  # .blockmap files at this URL. See RELEASING.md for the layout. Namespaced
  # under /ruby/ since codeongrass.com is the umbrella domain for multiple apps.
  provider: generic
  url: https://updates.codeongrass.com/ruby/mac/
  channel: latest
